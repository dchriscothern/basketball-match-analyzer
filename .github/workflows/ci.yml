name: Basketball Analyzer CI

on:
  push:
    branches: [main, sandbox]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Compile key entrypoints
        run: |
          python -m py_compile app.py
          python -m py_compile dashboard.py

      - name: Run tests
        run: |
          pytest -q
