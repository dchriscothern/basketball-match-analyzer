[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-match-analyzer"
version = "0.1.0"
description = "Basketball-focused multi-agent video analysis scaffold"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Codex"}]
dependencies = [
  "opencv-python-headless>=4.13",
  "streamlit>=1.40",
  "supervision>=0.27",
  "torch>=2.10",
  "torchvision>=0.25",
  "ultralytics>=8.4.23",
  "yt-dlp>=2025.8.22",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
