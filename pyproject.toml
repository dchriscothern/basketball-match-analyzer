[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-match-analyzer"
version = "0.1.0"
description = "Basketball-focused multi-agent video analysis scaffold"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Codex"}]
dependencies = [
  "streamlit>=1.40",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
